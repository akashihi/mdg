      operationId: getEvaluationReport
      parameters:
        - $ref: './components/parameters.yaml#/IfNoneMatch'
      responses:
        '200':
          description: The evaluation report.
          headers:
            ETag:
              description: Quoted uppercase hex MD5 of today's date.
              schema:
                type: string
          content:
            application/vnd.mdg+json;version=1:
              schema:
                $ref: './components/schemas/report.yaml#/EvaluationReport'
        '304':
