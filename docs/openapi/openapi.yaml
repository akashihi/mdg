      operationId: getSimpleAssetReport
      parameters:
        - $ref: './components/parameters.yaml#/StartDate'
        - $ref: './components/parameters.yaml#/EndDate'
        - $ref: './components/parameters.yaml#/Granularity'
      responses:
        '200':
          $ref: './components/responses.yaml#/SeriesReport'
  /reports/assets/currency:
    get:
      tags: [Reports]
      summary: Assets over time, by currency
      description: |
        One series per currency, named by its ISO code. Only currencies that
        actually hold assets in the range get a series.
      operationId: getAssetsByCurrencyReport
      parameters:
        - $ref: './components/parameters.yaml#/StartDate'
        - $ref: './components/parameters.yaml#/EndDate'
        - $ref: './components/parameters.yaml#/Granularity'
      responses:
        '200':
          $ref: './components/responses.yaml#/SeriesReport'
  /reports/assets/type:
    get:
      tags: [Reports]
      summary: Assets over time, by asset category
      description: One series per asset category.
      operationId: getAssetsByTypeReport
      parameters:
        - $ref: './components/parameters.yaml#/StartDate'
        - $ref: './components/parameters.yaml#/EndDate'
        - $ref: './components/parameters.yaml#/Granularity'
      responses:
        '200':
          $ref: './components/responses.yaml#/SeriesReport'
  /reports/income/events:
    get:
      tags: [Reports]
      summary: Income events over time
      description: One series per income account, of the amounts received in each bucket.
      operationId: getIncomeEventsReport
      parameters:
        - $ref: './components/parameters.yaml#/StartDate'
        - $ref: './components/parameters.yaml#/EndDate'
        - $ref: './components/parameters.yaml#/Granularity'
      responses:
        '200':
          $ref: './components/responses.yaml#/SeriesReport'
  /reports/expense/events:
    get:
      tags: [Reports]
      summary: Expense events over time
      description: One series per expense account, of the amounts spent in each bucket.
      operationId: getExpenseEventsReport
      parameters:
        - $ref: './components/parameters.yaml#/StartDate'
        - $ref: './components/parameters.yaml#/EndDate'
        - $ref: './components/parameters.yaml#/Granularity'
      responses:
        '200':
          $ref: './components/responses.yaml#/SeriesReport'
  /reports/income/accounts:
    get:
      tags: [Reports]
      summary: Income structure
      description: |
        Income over the range as a flattened tree of categories and accounts.
      operationId: getIncomeStructureReport
      parameters:
        - $ref: './components/parameters.yaml#/StartDate'
        - $ref: './components/parameters.yaml#/EndDate'
      responses:
        '200':
          $ref: './components/responses.yaml#/HierarchicalReport'
  /reports/expense/accounts:
    get:
      tags: [Reports]
      summary: Expense structure
      description: |
        Expenses over the range as a flattened tree of categories and accounts.
      operationId: getExpenseStructureReport
      parameters:
        - $ref: './components/parameters.yaml#/StartDate'
        - $ref: './components/parameters.yaml#/EndDate'
      responses:
        '200':
          $ref: './components/responses.yaml#/HierarchicalReport'
  /reports/budget/execution:
    get:
      tags: [Reports]
      summary: Budget execution over time
      description: |
        Actual and expected income and expense, plus profit, for every budget
        overlapping the range. A budget that starts before `startDate` but ends
        inside it is included, and vice versa.

      operationId: getBudgetExecutionReport
      parameters:
        - $ref: './components/parameters.yaml#/StartDate'
        - $ref: './components/parameters.yaml#/EndDate'
      responses:
        '200':
          description: The budget execution report.
          content:
            application/vnd.mdg+json;version=1:
              schema:
                $ref: './components/schemas/report.yaml#/BudgetExecutionReport'
  /reports/budget/cashflow/{budget_id}:
    get:
      tags: [Reports]
      summary: Budget cashflow
      description: |
        Daily cumulative balances on all operational accounts across one budget's
