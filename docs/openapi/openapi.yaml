    put:
      tags: [Settings]
      summary: Configure transaction dialog auto-closing
      description: |
        `value` must be `true` or `false`.
      operationId: setTransactionCloseDialog
      requestBody:
        required: true
        content:
          application/vnd.mdg+json;version=1:
            schema:
              $ref: './components/schemas/setting.yaml#/SettingUpdateCloseDialog'
            example: { value: 'true' }
      responses:
        '202':
          $ref: './components/responses.yaml#/SettingAccepted'
        '422':
          $ref: './components/responses.yaml#/UnprocessableEntity'
  /settings/ui.language:
    put:
      tags: [Settings]
      summary: Set the system locale
      description: |
        A locale name such as `en-US`.

      operationId: setUiLanguage
      requestBody:
        required: true
        content:
          application/vnd.mdg+json;version=1:
            schema:
              $ref: './components/schemas/setting.yaml#/SettingUpdateLanguage'
            example: { value: en-US }
      responses:
        '202':
          $ref: './components/responses.yaml#/SettingAccepted'
        '422':
          $ref: './components/responses.yaml#/UnprocessableEntity'
  /settings/ui.overviewpanel.widgets:
    put:
      tags: [Settings]
      summary: Configure the overview panel widgets
      description: |
        `value` is a JSON object **encoded as a string**, naming the widget in
        each of the four overview slots — `lt`, `rt`, `lb`, `rb`. The backend does
        not validate it; the frontend owns the format.
      operationId: setOverviewPanelWidgets
      requestBody:
        required: true
