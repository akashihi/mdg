      responses:
        '202':
          $ref: './components/responses.yaml#/SettingAccepted'
        '422':
          $ref: './components/responses.yaml#/UnprocessableEntity'
  /settings/mnt.transaction.reindex:
    put:
      tags: [Settings]
      summary: Rebuild the full-text index
      description: |
        A maintenance trigger.

        Recreates the Elasticsearch index using.

        The call is synchronous and can take a while on a large database; the
        response only returns once the reindex completes.

        The controller method takes no request body. The vendor content type is
        still required, but the payload itself is never parsed — any bytes at all
        are accepted. Send `{}`.
      operationId: reindexTransactions
      requestBody:
        required: false
        content:
          application/vnd.mdg+json;version=1:
            schema:
              type: object
            example: {}
      responses:
        '202':
          $ref: './components/responses.yaml#/MaintenanceAccepted'
  /settings/mnt.reporting.refresh:
    put:
      tags: [Settings]
      summary: Refresh the reporting materialized views
      description: |
        A maintenance trigger.

        Refreshes the materialized query tables.

        The controller method takes no request body. The vendor content type is
        still required, but the payload itself is never parsed — any bytes at all
        are accepted. Send `{}`.
      operationId: refreshReporting
      requestBody:
        required: false
        content:
          application/vnd.mdg+json;version=1:
            schema:
              type: object
            example: {}
      responses:
        '202':
          $ref: './components/responses.yaml#/MaintenanceAccepted'
