                  - { id: ui.language, value: en-US }
                  - { id: ui.overviewpanel.widgets, value: '{}' }
  /settings/{id}:
    get:
      tags: [Settings]
      summary: View a setting
      operationId: getSetting
      parameters:
        - $ref: './components/parameters.yaml#/SettingId'
      responses:
        '200':
          description: The setting.
          content:
            application/vnd.mdg+json;version=1:
              schema:
                $ref: './components/schemas/setting.yaml#/Setting'
  /settings/currency.primary:
    put:
      tags: [Settings]
      summary: Set the primary currency
      description: |
        `value` must be the ISO 4217 numeric code of a currency that exists in the
        currency table; anything else is rejected with 422
        `SETTING_DATA_INVALID`.
      operationId: setPrimaryCurrency
      requestBody:
