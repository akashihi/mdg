        budget's scheduled entries and daily allowances.

      operationId: getBudgetCashflowReport
      parameters:
        - name: budget_id
          in: path
          required: true
          description: Budget to report on, as `YYYYMMDD`.
          schema:
            type: integer
            format: int64
          example: 20170204
      responses:
        '200':
          description: The budget cashflow report.
          content:
            application/vnd.mdg+json;version=1:
              schema:
                $ref: './components/schemas/report.yaml#/BudgetCashflowReport'

  /settings:
    get:
