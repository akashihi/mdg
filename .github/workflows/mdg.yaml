name: MDG CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  api-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
      - name: Install dependencies
        working-directory: ./api-test
        run: npm ci
      - name: Execute linters
        working-directory: ./api-test
        run: npm run lint

  spec-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
      - name: Lint the OpenAPI specification
        run: npx @stoplight/spectral-cli lint docs/openapi/openapi.yaml --ruleset docs/openapi/.spectral.yaml

  backend-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 18
        uses: actions/setup-java@v3
        with:
          java-version: '18'
          distribution: 'adopt'
      - name: Run ktlint
        working-directory: ./backend
        run: mvn --batch-mode --update-snapshots clean compile ktlint:check
      - name: Unit tests
        working-directory: ./backend
        run: mvn --batch-mode --update-snapshots clean test-compile test

  api-test:
    runs-on: ubuntu-latest
    needs:
      - api-test-lint
      - backend-lint
      - spec-lint
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: mdg
          POSTGRES_PASSWORD: mdg
          POSTGRES_DB: mdg
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Dump docker logs on failure
        if: failure()
        uses: jwalton/gh-docker-logs@v1
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
      - name: Set up JDK 18
        uses: actions/setup-java@v3
        with:
          java-version: '18'
          distribution: 'adopt'
      - name: Configure sysctl limits
        run: |
          sudo swapoff -a
          sudo sysctl -w vm.swappiness=1
          sudo sysctl -w fs.file-max=262144
          sudo sysctl -w vm.max_map_count=262144
      - name: Start elasticsearch
        run: docker run -d --name es -e "discovery.type=single-node" -e "http.publish_host=localhost" -e "http.publish_port=9200" -p 9200:9200 -p 9300:9300 -v ./dictionaries:/usr/share/elasticsearch/config/hunspell library/elasticsearch:7.16.2 
      - name: Install dependencies
        working-directory: ./api-test
        run: npm ci
      - name: Start MDG service
        working-directory: ./backend
        run: JAVA_TOOL_OPTIONS=-XX:-UseContainerSupport mvn --batch-mode --update-snapshots clean compile spring-boot:start
      - name: Install API test dependencies
        working-directory: ./api-test
        run: npm ci
      - name: Debug ES
        run: docker logs es
      - name: Run API tests
        working-directory: ./api-test
        run: npx gulp test
      - uses: astral-sh/setup-uv@v6
      - name: Reset database for schemathesis
        env:
          PGPASSWORD: mdg
        run: psql -h localhost -U mdg -d mdg -q -v ON_ERROR_STOP=1 -f docs/openapi/reset.sql
      - name: Run schemathesis
        continue-on-error: true
        timeout-minutes: 20
        env:
          SKIP_RESET: '1'
        run: docs/openapi/schemathesis.sh --phases examples,stateful,coverage,fuzzing --report junit,har
      - name: Upload schemathesis report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schemathesis-report
          path: schemathesis-report/
          if-no-files-found: ignore
      - name: Stop MDG service
        if: always()
        working-directory: ./backend
        run: mvn spring-boot:stop

  mdg-build:
    runs-on: ubuntu-latest
    needs:
      - api-test
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
      - name: Set up JDK 18
        uses: actions/setup-java@v3
        with:
          java-version: '18'
          distribution: 'adopt'
      - name: Build with Maven
        working-directory: ./backend
        run: mvn --batch-mode --update-snapshots clean package spring-boot:repackage
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v3
        with:
          context: backend/
          push: true
          tags: akashihi/mdg:master,akashihi/mdg:build-${{ github.run_number }}

  web-ui-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Codestyle
        working-directory: ./frontend
        run: npx prettier --check src/
      - name: Lint
        working-directory: ./frontend
        run: npx eslint src/js/**

  web-ui-build:
    runs-on: ubuntu-latest
    needs:
      - web-ui-lint
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Build package
        working-directory: ./frontend
        run: npm run build
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v3
        with:
          context: frontend/
          push: true
          tags: akashihi/mdg-web-ui:master,akashihi/mdg-web-ui:build-${{ github.run_number }}
