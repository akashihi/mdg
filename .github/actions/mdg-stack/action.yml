name: Start MDG stack
description: >-
  Starts Elasticsearch and the MDG backend on the runner, and builds the transaction index.
  Expects the repository checked out and a Postgres service on localhost:5432 (mdg/mdg/mdg).

runs:
  using: composite
  steps:
    - name: Set up JDK 18
      uses: actions/setup-java@v3
      with:
        java-version: '18'
        distribution: 'adopt'
    - name: Configure sysctl limits
      shell: bash
      run: |
        sudo swapoff -a
        sudo sysctl -w vm.swappiness=1
        sudo sysctl -w fs.file-max=262144
        sudo sysctl -w vm.max_map_count=262144
    - name: Start elasticsearch
      shell: bash
      run: docker run -d --name es -e "discovery.type=single-node" -e "http.publish_host=localhost" -e "http.publish_port=9200"  -e ES_JAVA_OPTS="-Xms1g -Xmx1g"  -e ES_JAVA_HOME=/opt/java/openjdk -v "$JAVA_HOME_17_X64:/opt/java/openjdk:ro" -p 9200:9200 -p 9300:9300 -v ./dictionaries:/usr/share/elasticsearch/config/hunspell library/elasticsearch:7.16.2
    - name: Wait for elasticsearch
      shell: bash
      run: curl --retry 30 --retry-connrefused --retry-delay 2 -fsS 'localhost:9200/_cluster/health?wait_for_status=yellow&timeout=60s'
    - name: Start MDG service
      shell: bash
      working-directory: ./backend
      run: JAVA_TOOL_OPTIONS=-XX:-UseContainerSupport mvn --batch-mode --update-snapshots clean compile spring-boot:start
    - name: Build the transaction index
      shell: bash
      run: |
        code=$(curl -sS -o /dev/null -w '%{http_code}' -X PUT localhost:8080/settings/mnt.transaction.reindex \
          -H 'Content-Type: application/vnd.mdg+json;version=1' -d '{}')
        if [ "$code" != "202" ]; then
          echo "::error title=reindex::PUT /settings/mnt.transaction.reindex answered HTTP $code, expected 202"
          exit 1
        fi
