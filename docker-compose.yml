version: "3"

volumes:
  db-data:

networks:
  frontend:
  backend:

x-service: &service
    restart: always
    init: true

services:
  postgres:
    <<: *service
    image: postgres:18
    volumes:
      - db-data:/var/lib/postgresql
    networks:
      - backend
    environment:
      - POSTGRES_DB=mdg
      - POSTGRES_USER=mdg
      - POSTGRES_PASSWORD=mdg
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "postgresql://mdg:mdg@mdg"]
  mdg:
    <<: *service
    image: akashihi/mdg:${MDG_TAG}
    networks:
      - backend
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - postgres
  ui:
    <<: *service
    image: akashihi/mdg-web-ui:${UI_TAG}
    networks:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - mdg